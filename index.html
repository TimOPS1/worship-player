<script>

const pc=n=>({C:0,D:2,E:4,F:5,G:7,A:9,B:11}[n[0]]+(/[#♯]/.test(n[1]||'')?1:/[b♭]/.test(n[1]||'')?-1:0)+12)%12;
function secId(t){if(t!==t.toUpperCase())return null;const x=t.replace(/[\[\]():.\s]/g,'').toLowerCase();if(!x||x.length>16)return null;
 const r=y=>{let m;if(m=y.match(/^(verse|vers|strophe)(\d*)([a-z]?)$/))return 'V'+(m[2]||'1')+m[3].toUpperCase();

C:[["C        G","Dir gehört der Ruhm, Dir gehört das Lied"],["Em       D","wir singen laut, was uns bewegt"]],
V2:[["G            D","Am Morgen früh bist du schon da"],["Em           C","du bist mir immer nah"]],
B:[["Em    C","Alles neigt sich vor dir"],["G     D","Alles neigt sich vor dir"]],O:[["G    D    C","(ausklingen lassen)"]]};

function dots(b){$('#dots').innerHTML=Array.from({length:st.ts},(_,k)=>`<i class="${k===b?(k?'a':'a0'):''}"></i>`).join('')}
// ---- Pad: Sample-Sets (gestreamt, 2 vorab entsperrte Audio-Elemente) oder Platzhalter-Synth ----
const SIL=(()=>{const n=800,b=new Uint8Array(44+n),w=(o,t)=>[...t].forEach((c,i)=>b[o+i]=c.charCodeAt(0)),u=(o,v)=>{b[o]=v&255;b[o+1]=v>>8&255;b[o+2]=v>>16&255;b[o+3]=v>>24&255};
 w(0,'RIFF');u(4,36+n);w(8,'WAVEfmt ');u(16,16);b[20]=1;b[22]=1;u(24,8000);u(28,8000);b[32]=1;b[34]=8;w(36,'data');u(40,n);b.fill(128,44);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))})();
let pool=null,pv=null,padTok=0,pend=null,tagc=0;

 pool.forEach(x=>{x.a.src=SIL;const r=x.a.play();if(r&&r.catch)r.catch(()=>{})})}
function synth(want,xf){const n=ac.currentTime,g=ac.createGain();g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.3,n+xf);g.connect(pm);const r=130.81*Math.pow(2,want/12);
 const os=[[1,'sine'],[1.5,'triangle'],[2,'sine'],[3,'sine']].map(([m,ty],j)=>{const o=ac.createOscillator();o.type=ty;o.frequency.value=r*m;o.detune.value=j*3;const og=ac.createGain();og.gain.value=j==3?.2:.6;o.connect(og).connect(g);o.start(n);return o});
 return{k:want,set:null,kill(x){const t=ac.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+x);os.forEach(o=>o.stop(t+x+.1))}}}
async function sampleVoice(k,xf,tok,slot){const blob=await dbGet('pads',st.setId+':'+k);if(!blob||tok!==padTok)return null;
 const p=pool[slot],tag=++tagc;p.tag=tag;p.g.gain.cancelScheduledValues(ac.currentTime);p.g.gain.value=0;if(p.url)URL.revokeObjectURL(p.url);p.url=URL.createObjectURL(blob);p.a.src=p.url;p.a.loop=true;
 try{await p.a.play()}catch(e){return null}
 if(tok!==padTok){if(p.tag===tag)p.a.pause();return null}
 const n=ac.currentTime;p.g.gain.setValueAtTime(0,n);p.g.gain.linearRampToValueAtTime(1,n+xf);
 return{k,set:st.setId,slot,kill(x){const t=ac.currentTime;p.g.gain.cancelScheduledValues(t);p.g.gain.setValueAtTime(p.g.gain.value,t);p.g.gain.linearRampToValueAtTime(0,t+x);setTimeout(()=>{if(p.tag===tag)p.a.pause()},x*1000+300)}}}
function padSync(xf=2){if(!ac)return Promise.resolve();const want=st.pad?pkEff():null,sid=st.setId;
 if(pv&&pv.k===want&&pv.set===sid)return Promise.resolve();

 if(!pv&&want===null){pend=null;return Promise.resolve()}

// ---- Speicher (IndexedDB): Zustand + Pad-Dateien ----
let db=null,sv=null,delArm=false;
const openDB=()=>new Promise(r=>{try{const q=indexedDB.open('wlp',1);q.onupgradeneeded=()=>{q.result.createObjectStore('kv');q.result.createObjectStore('pads')};q.onsuccess=()=>{db=q.result;r(db)};q.onerror=()=>r(null)}catch(e){r(null)}});
const dbGet=(s,k)=>new Promise(r=>{if(!db)return r(null);try{const q=db.transaction(s).objectStore(s).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const dbSet=(s,k,v)=>new Promise(r=>{if(!db)return r(false);try{const t=db.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false);t.onabort=()=>r(false)}catch(e){r(false)}});

const saveNow=()=>dbSet('kv','state',{songs:st.songs,si:st.si,vol:st.vol,setId:st.setId,sets:st.sets,foot:st.foot,inv:st.inv,xp:st.xp});
function saveSoon(){clearTimeout(sv);sv=setTimeout(saveNow,600)}
// ---- Liedwechsel: Pad läuft weiter → Tonart in 4 s → Lied anzeigen → einzählen ----
function goSong(n){if(n<0||n>=st.songs.length||st.ph==='xf')return;ens();const was=st.play;stop();const to=st.songs[n].k;
 if(st.pad&&to!==pkEff()){const from=pkEff();st.ph='xf';st.pov=to;const pp=padSync(4);ov(`Tonart ${KN[from]} → ${KN[to]}`,'',true);Promise.all([pp,new Promise(r=>setTimeout(r,4000))]).then(()=>enter(n,was))}else enter(n,was)}

function ov(t,n,bar){const o=$('#ov');ovOn=!!(t||n);if(!ovOn){o.style.display='none';return}o.style.display='grid';$('#ot').textContent=t||'';$('#on').textContent=n||'';
 const b=$('#pb');b.style.display=bar?'block':'none';const i=b.firstChild;i.className='';if(bar){void i.offsetWidth;i.className='go'}}
// ---- Navigation im Chart (Scrollen, kein Highlight) ----
function goto(it){const c=$('#chart'),s=S(),r=it.r||s.mk[it.s];let y,x=0;
 if(s.pages&&r){const inn=c.querySelector(`.pg[data-p="${r.p}"] .in`);if(inn){const cr=c.getBoundingClientRect(),ir=inn.getBoundingClientRect();y=ir.top-cr.top+c.scrollTop+r.y*ir.height;x=ir.left-cr.left+c.scrollLeft+r.x*ir.width}}
 else{const e=$('#m-'+it.s);if(e)y=e.offsetTop}
 if(y!=null)c.scrollTo({top:Math.max(0,y-10),left:Math.max(0,x-10),behavior:'smooth'})}
// ---- Ganzes Chart ohne Scrollen: Seiten zuschneiden und auf die Fläche einpassen ----
const dims=pg=>{const c=pg.crop||{x0:0,y0:0,x1:1,y1:1,yf:1},iw=pg.iw||1,ih=pg.ih||1,yb=st.foot?c.y1:c.yf;return{iw,ih,x0:c.x0,y0:c.y0,cw:(c.x1-c.x0)*iw,ch:Math.max(.05,yb-c.y0)*ih}};
function layout(){const c=$('#chart'),s=S();if(!s.pages)return;const ps=[...c.querySelectorAll('.pg')];if(!ps.length)return;
 const AW=Math.max(50,c.clientWidth-16),AH=Math.max(50,c.clientHeight-16),d=s.pages.map(dims),sum=f=>d.reduce((a,x)=>a+f(x),0);
 const kr=Math.min(AW/sum(x=>x.cw),AH/Math.max(...d.map(x=>x.ch))),kc=Math.min(AW/Math.max(...d.map(x=>x.cw)),AH/sum(x=>x.ch)),k=Math.max(kr,kc)*st.zoom/100;
 $('#wrap').style.flexDirection=kc>kr?'column':'row';
 ps.forEach((p,i)=>{const x=d[i],n=p.firstChild;p.style.width=x.cw*k+'px';p.style.height=x.ch*k+'px';
  n.style.width=x.iw*k+'px';n.style.height=x.ih*k+'px';n.style.fontSize=x.ih*k+'px';n.style.left=-x.x0*x.iw*k+'px';n.style.top=-x.y0*x.ih*k+'px'})}

const ptr=new Map();let pz=null,lastTap=0;
{const c=$('#chart'),dist=()=>{const [a,b]=[...ptr.values()];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)};

// ---- Ablauf bearbeiten (Reihenfolge der Sections) ----
